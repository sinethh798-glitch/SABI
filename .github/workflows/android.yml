
name: Build SABI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q "SABI_Android_Project(1).zip" -d buildsrc

      - name: Build APK
        working-directory: buildsrc/SABI_Android_Project
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SABI-APK
          path: buildsrc/SABI_Android_Project/app/build/outputs/apk/debug/app-debug.apk
